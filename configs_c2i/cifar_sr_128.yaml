# CIFAR-10 Super-Resolution 32×32 → 128×128
# Training: python main_sr.py fit -c configs_c2i/cifar_sr_128.yaml
# Requires: Pretrained 32×32 CIFAR-10 checkpoint

seed_everything: true
tags:
  exp: &exp cifar10_sr_128x128
torch_hub_dir: null
huggingface_cache_dir: null

trainer:
  default_root_dir: ./workdirs
  accelerator: auto
  strategy: auto
  devices: auto
  num_nodes: 1
  precision: bf16-mixed
  logger:
      class_path: lightning.pytorch.loggers.WandbLogger
      init_args:
        project: pixnerd_cifar10_sr
        name: *exp
  num_sanity_val_steps: 0
  max_steps: 100000  # Fewer steps for SR training
  check_val_every_n_epoch: 25  # Validate every 25 epochs (~4,900 steps with batch size 64)
  log_every_n_steps: 50
  deterministic: null
  inference_mode: true
  use_distributed_sampler: false
  callbacks:
    - class_path: src.callbacks.model_checkpoint.CheckpointHook
      init_args:
        every_n_train_steps: 2500
        save_top_k: -1
        save_last: true
    - class_path: src.callbacks.save_images.SaveImagesHook
      init_args:
         save_dir: val
         save_compressed: true

model:
  vae:
    class_path: src.models.autoencoder.pixel.PixelAE
    init_args:
       scale: 1.0

  denoiser:
    class_path: src.models.transformer.pixnerd_c2i.PixNerDiT
    init_args:
        in_channels: 6  # 3 for noisy HR + 3 for upsampled LR conditioning
        patch_size: 8  # 128/8 = 16×16 patches (reasonable for 128×128)
        num_groups: 8
        hidden_size: &hidden_dim 512  # Larger model for higher resolution
        hidden_size_x: 64
        num_blocks: 16  # More blocks for higher resolution
        num_cond_blocks: 14
        nerf_mlpratio: 2
        num_classes: &num_classes 10  # CIFAR-10 classes

  conditioner:
    class_path: src.models.conditioner.class_label.LabelConditioner
    init_args:
      num_classes: *num_classes

  diffusion_trainer:
    class_path: src.diffusion.flow_matching.training_sr.SuperResolutionFlowMatchingTrainer
    init_args:
      lognorm_t: true
      timeshift: 1.0
      scheduler: &scheduler src.diffusion.flow_matching.scheduling.LinearScheduler
      loss_weight_fn: src.diffusion.flow_matching.training.constant
      image_cond_key: lr_upsampled  # Key in metadata for conditioning image

  diffusion_sampler:
    class_path: src.diffusion.flow_matching.sampling_sr.SuperResolutionEulerSampler
    init_args:
      num_steps: 50  # Sampling steps
      guidance: 2.0  # CFG guidance
      guidance_interval_min: 0.1
      guidance_interval_max: 1.0
      scheduler: *scheduler
      w_scheduler: null
      guidance_fn: src.diffusion.base.guidance.simple_guidance_fn
      step_fn: src.diffusion.flow_matching.sampling.ode_step_fn
      image_cond_key: lr_upsampled  # Key in metadata for conditioning image

  ema_tracker:
    class_path: src.callbacks.simple_ema.SimpleEMA
    init_args:
      decay: 0.9999

  optimizer:
    class_path: torch.optim.AdamW
    init_args:
      lr: 1e-4
      weight_decay: 0.0

data:
  train_dataset:
    class_path: src.data.dataset.cifar10_sr.CIFAR10SuperResDataset
    init_args:
      root: ./data/cifar10
      train: true
      download: true
      lr_size: 32
      hr_size: 128
      upscale_method: bicubic  # Method for creating HR targets from 32×32

  eval_dataset:
    class_path: src.data.dataset.cifar10_sr.CIFAR10SuperResEvalDataset
    init_args:
      root: ./data/cifar10
      hr_size: 128
      max_num_instances: 10000

  pred_dataset:
    class_path: src.data.dataset.cifar10_sr.CIFAR10SuperResEvalDataset
    init_args:
      root: ./data/cifar10
      hr_size: 128
      max_num_instances: 10000

  train_batch_size: 64  # Smaller batch for higher resolution
  train_num_workers: 4
  pred_batch_size: 64
  pred_num_workers: 1
