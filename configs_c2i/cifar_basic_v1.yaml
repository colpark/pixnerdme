# CIFAR-10 training configuration for PixNerd (Basic Flow Matching)
# Training: python main.py fit -c configs_c2i/cifar_basic_v1.yaml
seed_everything: true
tags:
  exp: &exp cifar10_basic_pixnerd_base
torch_hub_dir: null
huggingface_cache_dir: null
trainer:
  default_root_dir: ./workdirs
  accelerator: auto
  strategy: auto
  devices: auto
  num_nodes: 1
  precision: bf16-mixed
  logger:
      class_path: lightning.pytorch.loggers.WandbLogger
      init_args:
        project: pixnerd_cifar10
        name: *exp
  num_sanity_val_steps: 0
  max_steps: 200000
  check_val_every_n_epoch: 50
  log_every_n_steps: 50
  deterministic: null
  inference_mode: true
  use_distributed_sampler: false
  callbacks:
    - class_path: src.callbacks.model_checkpoint.CheckpointHook
      init_args:
        every_n_train_steps: 5000
        save_top_k: -1
        save_last: true
    - class_path: src.callbacks.save_images.SaveImagesHook
      init_args:
         save_dir: val
         save_compressed: true
model:
  vae:
    class_path: src.models.autoencoder.pixel.PixelAE
    init_args:
       scale: 1.0
  denoiser:
    class_path: src.models.transformer.pixnerd_c2i.PixNerDiT
    init_args:
        in_channels: 3
        patch_size: 4  # 32x32 / 4 = 8x8 patches
        num_groups: 8
        hidden_size: &hidden_dim 384  # Smaller model for CIFAR-10
        hidden_size_x: 32
        num_blocks: 12  # Fewer blocks for smaller dataset
        num_cond_blocks: 10
        nerf_mlpratio: 2
        num_classes: &num_classes 10  # CIFAR-10 has 10 classes
  conditioner:
    class_path: src.models.conditioner.class_label.LabelConditioner
    init_args:
      num_classes: *num_classes
  diffusion_trainer:
    class_path: src.diffusion.flow_matching.training.FlowMatchingTrainer
    init_args:
      lognorm_t: true
      timeshift: 1.0
      scheduler: &scheduler src.diffusion.flow_matching.scheduling.LinearScheduler
      loss_weight_fn: src.diffusion.flow_matching.training.constant
  diffusion_sampler:
    class_path: src.diffusion.flow_matching.sampling.EulerSampler
    init_args:
      num_steps: 50  # Fewer steps for faster sampling on CIFAR-10
      guidance: 2.0  # Lower guidance for smaller model
      guidance_interval_min: 0.1
      guidance_interval_max: 1.0
      scheduler: *scheduler
      w_scheduler: null  # Not needed for ODE sampler
      guidance_fn: src.diffusion.base.guidance.simple_guidance_fn
      step_fn: src.diffusion.flow_matching.sampling.ode_step_fn
  ema_tracker:
    class_path: src.callbacks.simple_ema.SimpleEMA
    init_args:
      decay: 0.9999
  optimizer:
    class_path: torch.optim.AdamW
    init_args:
      lr: 1e-4
      weight_decay: 0.0
data:
  train_dataset:
    class_path: src.data.dataset.cifar10.PixCIFAR10
    init_args:
      root: ./data/cifar10  # CIFAR-10 will be downloaded here
      train: true
      download: true
      random_crop: true  # Enable data augmentation
  eval_dataset:
    class_path: src.data.dataset.cifar10.CIFAR10RandomNDataset
    init_args:
      num_classes: 10
      max_num_instances: 10000
      latent_shape:
        - 3
        - 32
        - 32
  pred_dataset:
    class_path: src.data.dataset.cifar10.CIFAR10RandomNDataset
    init_args:
      num_classes: *num_classes
      max_num_instances: 10000
      latent_shape:
        - 3
        - 32
        - 32
  train_batch_size: 128  # Larger batch for smaller images
  train_num_workers: 4
  pred_batch_size: 128
  pred_num_workers: 1
